name: Build APK Aldera
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Godot et les templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: SDK Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Clé de debug et réglages Godot
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          S=~/.config/godot/editor_settings-4.3.tres
          echo '[gd_resource type="EditorSettings" format=3]' > $S
          echo '' >> $S
          echo '[resource]' >> $S
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> $S
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> $S
          echo "export/android/debug_keystore = \"$PWD/debug.keystore\"" >> $S
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
          echo 'export/android/debug_keystore_pass = "android"' >> $S
          cp $S ~/.config/godot/editor_settings-4.tres
      - name: Importer le projet
        run: godot --headless --import || true
      - name: Exporter l'APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Aldera.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: Aldera-APK
          path: build/Aldera.apk
